name: Deploy to sales-offer-frontend

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
          ${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        env:
          ECR_REPO: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/sales-offer-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build (no build-args; your Dockerfile doesn't use ARG)
          docker build \
            --platform linux/amd64 \
            -t sales-offer-frontend:$IMAGE_TAG .

          # Push SHA + latest tags
          docker tag sales-offer-frontend:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/sales-offer-frontend:$IMAGE_TAG
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/sales-offer-frontend:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            ECR_REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/sales-offer-frontend
            IMAGE_TAG=${{ github.sha }}

            # Login & pull specific image
            sudo aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            sudo docker login --username AWS --password-stdin $ECR_REPO
            sudo docker pull $ECR_REPO:$IMAGE_TAG

            # Stop/remove existing container
            sudo docker stop sales-offer-frontend || true
            sudo docker rm sales-offer-frontend || true

            # Run the new container
            # NOTE: Your image already contains NEXT_PUBLIC_BASE_URL and .env.
            # If you want to override at runtime, add: -e NEXT_PUBLIC_BASE_URL='https://override.example'
            sudo docker run -d \
              -p 3000:3000 \
              --name sales-offer-frontend \
              --restart unless-stopped \
              -e BASE_URL=${{ secrets.BACKEND_BASE_URL }}
              $ECR_REPO:$IMAGE_TAG

            # Clean dangling images (optional)
            #sudo docker image prune -f || true

