name: Deploy to EKS

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set target environment
        id: env
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          if [ -n "${{ inputs.environment }}" ]; then
            TARGET="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            TARGET=staging
          else
            TARGET=production
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" = "staging" ]; then
            echo "image_tag=staging-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${TARGET}" >> $GITHUB_OUTPUT
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 703671911262.dkr.ecr.us-east-1.amazonaws.com
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}"
          else
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=https://staging.sales-api.invespy.com"
          fi
          docker build $BUILD_ARG -t 703671911262.dkr.ecr.us-east-1.amazonaws.com/sales-offer-frontend:${{ steps.env.outputs.image_tag }} .
          docker push 703671911262.dkr.ecr.us-east-1.amazonaws.com/sales-offer-frontend:${{ steps.env.outputs.image_tag }}

      - name: Update GitOps repo (staging)
        if: steps.env.outputs.target == 'staging'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ steps.env.outputs.image_tag }}
          GITOPS_PATH: apps/sales-offer-frontend/overlays/staging
          SERVICE: sales-offer-frontend
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/it-admin-invespy/gitops.git gitops-repo
          cd gitops-repo
          git config user.email "ci@invespy.io"
          git config user.name "CI Bot"
          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|" ${GITOPS_PATH}/kustomization.yaml
          git add ${GITOPS_PATH}/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update ${SERVICE} staging to ${IMAGE_TAG}"
          git pull --rebase origin main && git push

      - name: Update kubeconfig (production)
        if: steps.env.outputs.target == 'production'
        run: aws eks update-kubeconfig --region us-east-1 --name invespy-cluster

      - name: Deploy to EKS (production)
        if: steps.env.outputs.target == 'production'
        run: |
          kubectl rollout restart deployment/sales-offer-frontend -n production
          kubectl rollout status deployment/sales-offer-frontend -n production --timeout=300s
