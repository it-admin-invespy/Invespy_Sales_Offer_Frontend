name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 703671911262.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ inputs.environment }}
        run: |
          if [ "$IMAGE_TAG" = "production" ]; then
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}"
          else
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=https://staging.sales-api.invespy.com"
          fi
          docker build $BUILD_ARG -t $ECR_REGISTRY/sales-offer-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/sales-offer-frontend:$IMAGE_TAG

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name invespy-cluster

      - name: Deploy to EKS
        run: |
          kubectl rollout restart deployment/sales-offer-frontend -n ${{ inputs.environment }}
          kubectl rollout status deployment/sales-offer-frontend -n ${{ inputs.environment }} --timeout=300s
