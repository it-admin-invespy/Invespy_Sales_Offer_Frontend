name: Deploy to EKS

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set target environment
        id: env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "target=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "target=staging" >> $GITHUB_OUTPUT
          else
            echo "target=production" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 703671911262.dkr.ecr.us-east-1.amazonaws.com
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}"
          else
            BUILD_ARG="--build-arg NEXT_PUBLIC_BASE_URL=https://staging.sales-api.invespy.com"
          fi
          docker build $BUILD_ARG -t 703671911262.dkr.ecr.us-east-1.amazonaws.com/sales-offer-frontend:${{ steps.env.outputs.target }} .
          docker push 703671911262.dkr.ecr.us-east-1.amazonaws.com/sales-offer-frontend:${{ steps.env.outputs.target }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name invespy-cluster

      - name: Deploy to EKS
        run: |
          kubectl rollout restart deployment/sales-offer-frontend -n ${{ steps.env.outputs.target }}
          kubectl rollout status deployment/sales-offer-frontend -n ${{ steps.env.outputs.target }} --timeout=300s
